# ============================================
# Docker Compose - Development Environment
# ============================================
# Usage:
#   1. Copy .env.example to .env: cp .env.example .env
#   2. Edit .env with your actual values
#   3. Run: docker-compose up -d
# ============================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: laundry-locker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Set default encoding
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: laundry-locker-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n '${REDIS_PASSWORD}' ]; then redis-server --requirepass ${REDIS_PASSWORD}; else redis-server; fi"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MQTT Broker (Mosquitto)
  # ============================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: laundry-locker-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - laundry-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Spring Boot Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laundry-locker-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: docker

      # Database Configuration (use container name 'postgres' as host)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis Configuration (use container name 'redis' as host)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT Configuration
      APP_SECURITY_JWT_SECRET: ${JWT_SECRET}

      # Application URLs
      APP_FRONTEND_URL: ${FRONTEND_URL}
      APP_BACKEND_URL: ${BACKEND_URL}

      # CORS Configuration
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Email Configuration
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

      # OAuth2 - Google
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # OAuth2 - GitHub
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # OAuth2 - Facebook
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}

      # OAuth2 - Zalo
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZALO_CLIENT_ID: ${ZALO_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZALO_CLIENT_SECRET: ${ZALO_CLIENT_SECRET}

      # VNPay Configuration
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}

      # MoMo Configuration
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}

      # Swagger/API Docs
      SPRINGDOC_API_DOCS_ENABLED: ${SWAGGER_ENABLED}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SWAGGER_ENABLED}

      # Sample Data Loading
      APP_LOAD_SAMPLE_DATA: ${LOAD_SAMPLE_DATA:-true}
      APP_DATA_FORCE_RELOAD: ${FORCE_RELOAD_DATA:-false}

      # Super Admin Bootstrap
      APP_ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      APP_ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@laundrylocker.com}
      APP_ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-Admin@123456}
      APP_ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Super Admin}

      # MQTT Configuration
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}

      # Scheduler Configuration
      APP_SCHEDULER_ORDER_TIMEOUT: ${SCHEDULER_ORDER_TIMEOUT:-30}
      APP_SCHEDULER_BOX_RELEASE_DELAY: ${SCHEDULER_BOX_RELEASE_DELAY:-5}
      APP_SCHEDULER_PICKUP_REMINDER: ${SCHEDULER_PICKUP_REMINDER:-24}

      # Staff Configuration
      APP_STAFF_MASTER_PIN: ${STAFF_MASTER_PIN:-999999}

      # Order Configuration
      APP_ORDER_PICKUP_HOURS_LIMIT: ${ORDER_PICKUP_HOURS_LIMIT:-24}
      APP_ORDER_OVERTIME_FEE: ${ORDER_OVERTIME_FEE:-500}
      APP_ORDER_MAX_OVERTIME_FEE: ${ORDER_MAX_OVERTIME_FEE:-50000}
      APP_ORDER_MAX_OVERTIME_PERCENT: ${ORDER_MAX_OVERTIME_PERCENT:-50}

      # JVM Options
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - laundry-network
    # Only use volumes when hot reload is needed in dev
    # volumes:
    #   - ./src:/app/src:ro

# ============================================
# Volumes - Persistent data storage
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local

# ============================================
# Networks - Internal communication
# ============================================
networks:
  laundry-network:
    driver: bridge

