# Authentication
AUTH_SUCCESS=認証成功。
AUTH_LOGIN_SUCCESS=ログイン成功。
AUTH_REGISTER_SUCCESS=登録成功。
AUTH_LOGOUT_SUCCESS=ログアウト成功。
AUTH_REFRESH_SUCCESS=トークン更新成功。
AUTH_VERIFICATION_SENT=メールが存在し、未確認の場合は確認メールが届きます。
AUTH_RESET_EMAIL_SENT=メールが存在する場合、パスワードリセット手順が届きます。
AUTH_PASSWORD_RESET_SUCCESS=パスワードリセット成功。
AUTH_EMAIL_VERIFIED=メール確認成功。

# Phone Authentication
AUTH_PHONE_LOGIN_SUCCESS=電話番号でログイン成功。
AUTH_PHONE_NEW_USER=新規ユーザー。登録を完了してください。
AUTH_PHONE_REGISTRATION_SUCCESS=電話番号で登録成功。

# Email OTP Authentication
AUTH_OTP_SENT=OTPがメールに送信されました。
AUTH_OTP_VERIFIED=OTP確認成功。
AUTH_EMAIL_NEW_USER=新規ユーザー。登録を完了してください。
AUTH_EMAIL_LOGIN_SUCCESS=メールでログイン成功。
AUTH_EMAIL_REGISTRATION_SUCCESS=メールで登録成功。
AUTH_REGISTRATION_COMPLETE=登録が完了しました。
AUTH_OTP_SEND_FAILED=OTP送信に失敗しました。もう一度お試しください。

# User
USER_PROFILE_OK=ユーザー情報取得成功。

# Token
TOKEN_VALID=トークンは有効です。
TOKEN_INVALID=トークンが無効または期限切れです。

# Common Errors
E_COM001=予期しないエラーが発生しました。
E_COM002=検証に失敗しました。
E_COM003=アクセスが拒否されました。
E_COM004=認証に失敗しました。
E_COM005=無効な引数です。

# Auth Errors
E_AUTH001=メールまたはパスワードが正しくありません。
E_AUTH002=トークンの有効期限が切れています。
E_AUTH003=無効なトークンです。
E_AUTH004=無効または期限切れのリフレッシュトークンです。
E_AUTH005=メールは既に使用されています。
E_AUTH006=無効または期限切れのパスワードリセットトークンです。
E_AUTH007=トークンが無効化されました。
E_AUTH008=無効または期限切れの登録トークンです。電話番号を再確認してください。
E_AUTH009=登録にはtempTokenまたはidTokenが必要です。

# Phone Errors
E_PHONE001=無効なFirebaseトークンです。
E_PHONE002=トークンに電話番号が見つかりません。

# OTP Errors
E_OTP001=無効または期限切れのOTPです。
E_OTP002=OTPは既に送信されました。再度リクエストする前にお待ちください。

# Validation Errors
E_VALIDATION001=パスワードは6文字以上である必要があります。
E_VALIDATION002=確認パスワードが一致しません。

# Order Errors
E_ORDER001=注文が見つかりません。
E_ORDER002=チェックアウトの注文ステータスが無効です。
E_ORDER003=注文は待機中ステータスではありません。
E_ORDER004=注文は準備完了ステータスではありません。
E_ORDER005=現在のステータスでは注文をキャンセルできません。
E_ORDER006=注文は初期化ステータスではありません。
E_ORDER007=注文は回収済みステータスではありません。
E_ORDER008=注文は処理中ステータスではありません。

# User Errors
E_USER001=ユーザーが見つかりません。

# Locker Errors
E_LOCKER001=ロッカーが見つかりません。

# Box Errors
E_BOX001=ボックスが見つかりません。
E_BOX002=ロッカーに空きボックスがありません。
E_BOX003=ボックスは利用できません。

# Service Errors
E_SERVICE001=サービスが見つかりません。

# Order Success Messages
ORDER_CREATED=注文を作成しました。
ORDER_RETRIEVED=注文を取得しました。
ORDERS_RETRIEVED=注文一覧を取得しました。
ORDER_CHECKOUT_SUCCESS=チェックアウト完了。
ORDER_COLLECTED=回収完了。
ORDER_RETURNED=ロッカーに返却しました。
ORDER_CANCELED=注文をキャンセルしました。
ORDER_CONFIRMED=注文を確認しました。
ORDER_PROCESSING=注文を処理中です。
ORDER_READY=注文の準備が完了しました。

# Store Success Messages
STORES_RETRIEVED=店舗一覧を取得しました。
STORE_RETRIEVED=店舗を取得しました。

# Locker Success Messages
LOCKERS_RETRIEVED=ロッカー一覧を取得しました。
LOCKER_RETRIEVED=ロッカーを取得しました。
BOXES_RETRIEVED=ボックス一覧を取得しました。

# Service Success Messages
SERVICES_RETRIEVED=サービス一覧を取得しました。
SERVICE_RETRIEVED=サービスを取得しました。

# Payment Success Messages
PAYMENT_CREATED=支払いを作成しました。
PAYMENT_SUCCESS=支払い完了。
PAYMENT_FAILED=支払い失敗。
PAYMENT_PENDING=支払い保留中。
PAYMENT_RETRIEVED=支払いを取得しました。

# Payment Errors
E_PAYMENT001=支払いが見つかりません。
E_PAYMENT002=無効な支払い署名です。
E_PAYMENT003=この注文は既に支払い済みです。
E_PAYMENT004=支払いが期限切れです。
E_PAYMENT005=サポートされていない支払い方法または支払いゲートウェイエラーです。
E_PAYMENT006=注文は支払い準備ができていません。

# Notification Success Messages
NOTIFICATIONS_RETRIEVED=通知一覧を取得しました。
UNREAD_COUNT_RETRIEVED=未読数を取得しました。
NOTIFICATION_MARKED_READ=通知を既読にしました。
ALL_NOTIFICATIONS_MARKED_READ=すべての通知を既読にしました。
NOTIFICATION_DELETED=通知を削除しました。

# HTTP Errors
E_HTTP_METHOD_NOT_ALLOWED=このエンドポイントではHTTPメソッドがサポートされていません。
E_UNSUPPORTED_MEDIA_TYPE=メディアタイプがサポートされていません。
E_MALFORMED_REQUEST=リクエストが不正または本文が無効です。
E_RESOURCE_NOT_FOUND=リクエストされたリソースが見つかりません。
E_FILE_TOO_LARGE=アップロードファイルが許可サイズを超えています。

# Database Errors
E_ENTITY_NOT_FOUND=リクエストされたエンティティが見つかりません。
E_DATA_INTEGRITY=データ整合性違反が発生しました。
E_DATABASE_ERROR=データベースエラーが発生しました。後でもう一度お試しください。

# State Errors
E_ILLEGAL_STATE=現在の状態ではこの操作は許可されていません。
E_NOT_IMPLEMENTED=この操作はサポートされていません。

# Rate Limit Errors
E_RATE_LIMIT=リクエストが多すぎます。後でもう一度お試しください。

# External Service Errors
E_EXTERNAL_SERVICE=外部サービスが一時的に利用できません。
