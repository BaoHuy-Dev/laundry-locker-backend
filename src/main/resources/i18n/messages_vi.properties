# Authentication
AUTH_SUCCESS=Xác thực thành công.
AUTH_LOGIN_SUCCESS=Đăng nhập thành công.
AUTH_REGISTER_SUCCESS=Đăng ký tài khoản thành công.
AUTH_LOGOUT_SUCCESS=Đăng xuất thành công.
AUTH_REFRESH_SUCCESS=Làm mới token thành công.
AUTH_VERIFICATION_SENT=Nếu email tồn tại và chưa được xác thực, bạn sẽ nhận được email xác thực.
AUTH_RESET_EMAIL_SENT=Nếu email tồn tại, bạn sẽ nhận được hướng dẫn đặt lại mật khẩu.
AUTH_PASSWORD_RESET_SUCCESS=Mật khẩu đã được đặt lại thành công.
AUTH_EMAIL_VERIFIED=Email đã được xác thực thành công.

# Phone Authentication
AUTH_PHONE_LOGIN_SUCCESS=Đăng nhập bằng số điện thoại thành công.
AUTH_PHONE_NEW_USER=Người dùng mới. Vui lòng hoàn tất đăng ký.
AUTH_PHONE_REGISTRATION_SUCCESS=Đăng ký bằng số điện thoại thành công.

# Email OTP Authentication
AUTH_OTP_SENT=Mã OTP đã được gửi đến email của bạn.
AUTH_OTP_VERIFIED=Xác thực OTP thành công.
AUTH_EMAIL_NEW_USER=Người dùng mới. Vui lòng hoàn tất đăng ký.
AUTH_EMAIL_LOGIN_SUCCESS=Đăng nhập bằng email thành công.
AUTH_EMAIL_REGISTRATION_SUCCESS=Đăng ký bằng email thành công.
AUTH_REGISTRATION_COMPLETE=Hoàn tất đăng ký thành công.
AUTH_OTP_SEND_FAILED=Gửi OTP thất bại. Vui lòng thử lại.

# User
USER_PROFILE_OK=Lấy thông tin người dùng thành công.

# Token
TOKEN_VALID=Token hợp lệ.
TOKEN_INVALID=Token không hợp lệ hoặc đã hết hạn.

# Common Errors
E_COM001=Đã xảy ra lỗi không mong muốn.
E_COM002=Dữ liệu đầu vào không hợp lệ.
E_COM003=Không có quyền truy cập.
E_COM004=Xác thực thất bại.
E_COM005=Tham số không hợp lệ.

# Auth Errors
E_AUTH001=Email hoặc mật khẩu không đúng.
E_AUTH002=Token đã hết hạn.
E_AUTH003=Token không hợp lệ.
E_AUTH004=Refresh token không hợp lệ hoặc đã hết hạn.
E_AUTH005=Email đã được sử dụng.
E_AUTH006=Token đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.
E_AUTH007=Token đã bị vô hiệu hóa.
E_AUTH008=Token đăng ký không hợp lệ hoặc đã hết hạn. Vui lòng xác minh lại số điện thoại.
E_AUTH009=Cần có tempToken hoặc idToken để đăng ký.

# Phone Errors
E_PHONE001=Token Firebase không hợp lệ.
E_PHONE002=Không tìm thấy số điện thoại trong token.

# OTP Errors
E_OTP001=OTP không hợp lệ hoặc đã hết hạn.
E_OTP002=OTP đã được gửi. Vui lòng chờ trước khi yêu cầu lại.

# Validation Errors
E_VALIDATION001=Mật khẩu phải có ít nhất 6 ký tự.
E_VALIDATION002=Mật khẩu xác nhận không khớp.

# Order Errors
E_ORDER001=Không tìm thấy đơn hàng.
E_ORDER002=Trạng thái đơn hàng không hợp lệ để thanh toán.
E_ORDER003=Đơn hàng không ở trạng thái CHỜ LẤY.
E_ORDER004=Đơn hàng không ở trạng thái SẴN SÀNG.
E_ORDER005=Không thể hủy đơn hàng ở trạng thái hiện tại.
E_ORDER006=Đơn hàng không ở trạng thái MỚI TẠO.
E_ORDER007=Đơn hàng không ở trạng thái ĐÃ LẤY.
E_ORDER008=Đơn hàng không ở trạng thái ĐANG XỬ LÝ.
E_ORDER_NOT_OWNER=Bạn không phải là chủ sở hữu đơn hàng này.

# User Errors
E_USER001=Không tìm thấy người dùng.

# Locker Errors
E_LOCKER001=Không tìm thấy tủ.

# Box Errors
E_BOX001=Không tìm thấy ô tủ.
E_BOX002=Không có ô tủ trống.
E_BOX003=Ô tủ không khả dụng.

# Service Errors
E_SERVICE001=Không tìm thấy dịch vụ.

# Order Success Messages
ORDER_CREATED=Tạo đơn hàng thành công.
ORDER_RETRIEVED=Lấy thông tin đơn hàng thành công.
ORDERS_RETRIEVED=Lấy danh sách đơn hàng thành công.
ORDER_CHECKOUT_SUCCESS=Thanh toán đơn hàng thành công.
ORDER_COLLECTED=Lấy đồ thành công.
ORDER_RETURNED=Trả đồ vào tủ thành công.
ORDER_CANCELED=Hủy đơn hàng thành công.
ORDER_CONFIRMED=Xác nhận đơn hàng thành công.
ORDER_PROCESSING=Đơn hàng đang được xử lý.
ORDER_READY=Đơn hàng sẵn sàng để lấy.

# Store Success Messages
STORES_RETRIEVED=Lấy danh sách cửa hàng thành công.
STORE_RETRIEVED=Lấy thông tin cửa hàng thành công.

# Locker Success Messages
LOCKERS_RETRIEVED=Lấy danh sách tủ thành công.
LOCKER_RETRIEVED=Lấy thông tin tủ thành công.
BOXES_RETRIEVED=Lấy danh sách ô tủ thành công.

# Service Success Messages
SERVICES_RETRIEVED=Lấy danh sách dịch vụ thành công.
SERVICE_RETRIEVED=Lấy thông tin dịch vụ thành công.

# Payment Success Messages
PAYMENT_CREATED=Tạo thanh toán thành công.
PAYMENT_SUCCESS=Thanh toán thành công.
PAYMENT_FAILED=Thanh toán thất bại.
PAYMENT_PENDING=Thanh toán đang chờ xử lý.
PAYMENT_RETRIEVED=Lấy thông tin thanh toán thành công.

# Payment Errors
E_PAYMENT001=Không tìm thấy thanh toán.
E_PAYMENT002=Chữ ký thanh toán không hợp lệ.
E_PAYMENT003=Đơn hàng đã được thanh toán.
E_PAYMENT004=Thanh toán đã hết hạn.
E_PAYMENT005=Phương thức thanh toán không được hỗ trợ hoặc lỗi cổng thanh toán.
E_PAYMENT006=Đơn hàng chưa sẵn sàng để thanh toán.

# Notification Success Messages
NOTIFICATIONS_RETRIEVED=Lấy danh sách thông báo thành công.
UNREAD_COUNT_RETRIEVED=Lấy số thông báo chưa đọc thành công.
NOTIFICATION_MARKED_READ=Đã đánh dấu thông báo đã đọc.
ALL_NOTIFICATIONS_MARKED_READ=Đã đánh dấu tất cả thông báo đã đọc.
NOTIFICATION_DELETED=Xóa thông báo thành công.

# HTTP Errors
E_HTTP_METHOD_NOT_ALLOWED=Phương thức HTTP không được hỗ trợ cho endpoint này.
E_UNSUPPORTED_MEDIA_TYPE=Loại media không được hỗ trợ.
E_MALFORMED_REQUEST=Yêu cầu không hợp lệ hoặc nội dung không đúng định dạng.
E_RESOURCE_NOT_FOUND=Không tìm thấy tài nguyên yêu cầu.
E_FILE_TOO_LARGE=File tải lên vượt quá kích thước cho phép.

# Database Errors
E_ENTITY_NOT_FOUND=Không tìm thấy đối tượng yêu cầu.
E_DATA_INTEGRITY=Lỗi toàn vẹn dữ liệu.
E_DATABASE_ERROR=Lỗi cơ sở dữ liệu. Vui lòng thử lại sau.

# State Errors
E_ILLEGAL_STATE=Không thể thực hiện thao tác ở trạng thái hiện tại.
E_NOT_IMPLEMENTED=Tính năng này chưa được hỗ trợ.

# Rate Limit Errors
E_RATE_LIMIT=Quá nhiều yêu cầu. Vui lòng thử lại sau.

# External Service Errors
E_EXTERNAL_SERVICE=Dịch vụ bên ngoài tạm thời không khả dụng.

# Admin Auth Messages
ADMIN_AUTH_2FA_REQUIRED=Mật khẩu đã xác thực. Vui lòng kiểm tra email để lấy mã 2FA.
ADMIN_AUTH_2FA_SUCCESS=Đăng nhập admin thành công.

# Image Update Messages
AVATAR_UPDATED=Cập nhật ảnh đại diện thành công.
STORE_IMAGE_UPDATED=Cập nhật ảnh cửa hàng thành công.
SERVICE_IMAGE_UPDATED=Cập nhật ảnh dịch vụ thành công.
LOCKER_IMAGE_UPDATED=Cập nhật ảnh tủ khóa thành công.

# Admin Auth Errors
E_ADMIN_AUTH_LOCKED=Tài khoản bị khóa do đăng nhập sai quá nhiều lần. Vui lòng thử lại sau.
E_ADMIN_AUTH_INVALID_CREDENTIALS=Email hoặc mật khẩu không đúng.
E_ADMIN_AUTH_NOT_ADMIN=Truy cập bị từ chối. Yêu cầu quyền Admin.
E_ADMIN_AUTH_ACCOUNT_DISABLED=Tài khoản đã bị vô hiệu hóa.
E_ADMIN_AUTH_OTP_SEND_FAILED=Gửi OTP thất bại. Vui lòng thử lại.
E_ADMIN_AUTH_TEMP_TOKEN_INVALID=Phiên xác thực không hợp lệ hoặc đã hết hạn.
E_ADMIN_AUTH_OTP_INVALID=Mã OTP không hợp lệ hoặc đã hết hạn.
