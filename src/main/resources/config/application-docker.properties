# ============================================
# Docker Profile Configuration
# ============================================
# This profile is automatically used when running in Docker
# All values are read from environment variables set in docker-compose.yml
# ============================================

# Application
spring.application.name=laundry-locker-backend

# Server
server.port=8080

# ============================================
# DataSource - PostgreSQL (from environment variables)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA/Hibernate
# ============================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=laundry_locker_schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# i18n
# ============================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ============================================
# JWT Configuration (from environment variables)
# ============================================
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.expiration-ms=86400000
app.security.jwt.refresh-expiration-ms=2592000000

# ============================================
# Redis Configuration (from environment variables)
# ============================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ============================================
# Rate Limiting
# ============================================
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=60

# ============================================
# CORS Configuration (from environment variables)
# ============================================
app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# ============================================
# Application Settings (from environment variables)
# ============================================
app.name=Laundry Locker
app.frontend.url=${APP_FRONTEND_URL}
app.backend.url=${APP_BACKEND_URL}

# ============================================
# Email Configuration (from environment variables)
# ============================================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# Email Expiration Settings
# ============================================
app.email.verification-expiration-ms=86400000
app.email.reset-password-expiration-ms=3600000

# ============================================
# Swagger/API Docs (from environment variables)
# ============================================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
# Fix Pageable parameter display in Swagger
springdoc.default-flat-param-object=true

# ============================================
# Logging (optimized for production/docker)
# ============================================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.huynqb=INFO

# Error Response
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never

# ============================================
# OAuth2 Client - Google (from environment variables)
# ============================================
spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================
# OAuth2 Client - GitHub (from environment variables)
# ============================================
spring.security.oauth2.client.registration.github.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ============================================
# OAuth2 Client - Facebook (from environment variables)
# ============================================
spring.security.oauth2.client.registration.facebook.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post

# OAuth2 Provider - Facebook
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ============================================
# OAuth2 Client - Zalo (from environment variables)
# ============================================
spring.security.oauth2.client.registration.zalo.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZALO_CLIENT_ID}
spring.security.oauth2.client.registration.zalo.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ZALO_CLIENT_SECRET}
spring.security.oauth2.client.registration.zalo.scope=profile
spring.security.oauth2.client.registration.zalo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.zalo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zalo.client-authentication-method=client_secret_post

# OAuth2 Provider - Zalo
spring.security.oauth2.client.provider.zalo.authorization-uri=https://oauth.zaloapp.com/v4/authorize
spring.security.oauth2.client.provider.zalo.token-uri=https://oauth.zaloapp.com/v4/access_token
spring.security.oauth2.client.provider.zalo.user-info-uri=https://graph.zalo.me/v2.0/me?fields=id,name,picture
spring.security.oauth2.client.provider.zalo.user-name-attribute=id

# ============================================
# Firebase Configuration
# ============================================
firebase.credentials.path=classpath:firebase/firebase-service-account.json

# ============================================
# MQTT Configuration (IoT Locker Control)
# ============================================
mqtt.broker-url=${MQTT_BROKER_URL:tcp://mosquitto:1883}
mqtt.client-id=laundry-backend-docker-${random.uuid}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic-prefix=locker

# ============================================
# VNPay Configuration (from environment variables)
# ============================================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${APP_BACKEND_URL}/api/payments/vnpay/return
vnpay.ipn-url=${APP_BACKEND_URL}/api/payments/vnpay/ipn
vnpay.version=2.1.0
vnpay.expire-minutes=15

# ============================================
# MoMo Configuration (from environment variables)
# ============================================
momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=${APP_BACKEND_URL}/api/payments/momo/return
momo.ipn-url=${APP_BACKEND_URL}/api/payments/momo/callback
momo.expire-minutes=15

# ============================================
# Sample Data Configuration
# ============================================
# Enable loading sample data on startup
app.data.load-sample-data=${APP_LOAD_SAMPLE_DATA:true}
# Force reload data even if data already exists
app.data.force-reload=${APP_DATA_FORCE_RELOAD:false}

# ============================================
# Super Admin Bootstrap
# ============================================
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:admin@laundrylocker.com}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:Admin@123456}
app.admin.bootstrap.name=${APP_ADMIN_BOOTSTRAP_NAME:Super Admin}

# ============================================
# Scheduler Configuration
# ============================================
# Auto-cancel orders not confirmed within this time (minutes)
app.scheduler.order-confirm-timeout-minutes=${APP_SCHEDULER_ORDER_TIMEOUT:30}

# Delay before releasing boxes after order completion (minutes)
app.scheduler.box-release-delay-minutes=${APP_SCHEDULER_BOX_RELEASE_DELAY:5}

# Send pickup reminders after this time waiting (hours)
app.scheduler.pickup-reminder-hours=${APP_SCHEDULER_PICKUP_REMINDER:24}

# Scheduler job intervals (milliseconds)
app.scheduler.auto-cancel-rate-ms=300000
app.scheduler.box-release-rate-ms=120000
app.scheduler.reminder-rate-ms=3600000

# ============================================
# Staff Configuration
# ============================================
app.staff.master-pin=${APP_STAFF_MASTER_PIN:999999}

# ============================================
# Order & Pickup Configuration
# ============================================
app.order.pickup-hours-limit=${APP_ORDER_PICKUP_HOURS_LIMIT:24}
app.order.pickup-overtime-fee-per-hour=${APP_ORDER_OVERTIME_FEE:500}
app.order.pickup-max-overtime-fee=${APP_ORDER_MAX_OVERTIME_FEE:50000}
app.order.pickup-max-overtime-percent=${APP_ORDER_MAX_OVERTIME_PERCENT:50}

