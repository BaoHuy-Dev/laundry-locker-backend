# Application
spring.application.name=laundry-locker-backend

# Server
server.port=8080

# DataSource - PostgreSQL (DEV)
spring.datasource.url=jdbc:postgresql://localhost:5432/laundry_locker
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - DEV SETTINGS
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=laundry_locker_schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL + Bind Params (ENABLE FOR DEV)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT (DEV)
app.security.jwt.secret=dev-secret-key-very-unsafe
app.security.jwt.expiration-ms=86400000
app.security.jwt.refresh-expiration-ms=2592000000

# Redis Configuration (DEV)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# Rate Limiting - DISABLE IN DEV
app.security.rate-limit.enabled=false
app.security.rate-limit.requests-per-minute=1000

# Application URLs (DEV)
app.name=Laundry Locker (DEV)
app.frontend.url=http://localhost:3000
app.backend.url=http://localhost:8080

# Email Configuration (DEV - optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dev@gmail.com
spring.mail.password=dev-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Expiration
app.email.verification-expiration-ms=86400000
app.email.reset-password-expiration-ms=3600000

# Swagger - ENABLE IN DEV
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Logging - DEV (VERBOSE)
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter=DEBUG
logging.level.com.huynqb.laundrylockerbackend=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Error Response - DEV (FULL INFO)
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always

# OAuth2 Client - Google (DEV)
spring.security.oauth2.client.registration.google.client-id=dev-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dev-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client - GitHub (DEV)
spring.security.oauth2.client.registration.github.client-id=dev-github-client-id
spring.security.oauth2.client.registration.github.client-secret=dev-github-client-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client - Facebook (DEV)
spring.security.oauth2.client.registration.facebook.client-id=dev-facebook-client-id
spring.security.oauth2.client.registration.facebook.client-secret=dev-facebook-client-secret
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# OAuth2 Client - Zalo (DEV)
spring.security.oauth2.client.registration.zalo.client-id=dev-zalo-client-id
spring.security.oauth2.client.registration.zalo.client-secret=dev-zalo-client-secret
spring.security.oauth2.client.registration.zalo.scope=profile
spring.security.oauth2.client.registration.zalo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.zalo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zalo.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.zalo.authorization-uri=https://oauth.zaloapp.com/v4/authorize
spring.security.oauth2.client.provider.zalo.token-uri=https://oauth.zaloapp.com/v4/access_token
spring.security.oauth2.client.provider.zalo.user-info-uri=https://graph.zalo.me/v2.0/me?fields=id,name,picture
spring.security.oauth2.client.provider.zalo.user-name-attribute=id

# Firebase Configuration
firebase.credentials.path=classpath:firebase/firebase-service-account.json

# ===== MQTT Configuration (IoT Locker Control) =====
mqtt.broker-url=tcp://broker.hivemq.com:1883
mqtt.client-id=laundry-backend-dev-${random.uuid}
mqtt.username=
mqtt.password=
mqtt.topic-prefix=locker

# ===== VNPay Configuration (Sandbox) =====
vnpay.tmn-code=YOUR_VNPAY_TMN_CODE
vnpay.hash-secret=YOUR_VNPAY_HASH_SECRET
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay/return
vnpay.ipn-url=http://localhost:8080/api/payments/vnpay/ipn
vnpay.version=2.1.0
vnpay.expire-minutes=15

# ===== MoMo Configuration (Sandbox) =====
momo.partner-code=YOUR_MOMO_PARTNER_CODE
momo.access-key=YOUR_MOMO_ACCESS_KEY
momo.secret-key=YOUR_MOMO_SECRET_KEY
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.redirect-url=http://localhost:8080/api/payments/momo/return
momo.ipn-url=http://localhost:8080/api/payments/momo/callback
momo.expire-minutes=15
# momo.skip-signature-verification=true

# ===== Scheduler Configuration =====
# Auto-cancel orders not confirmed within this time (minutes)
app.scheduler.order-confirm-timeout-minutes=30

# Delay before releasing boxes after order completion (minutes)
app.scheduler.box-release-delay-minutes=5

# Send pickup reminders after this time waiting (hours)
app.scheduler.pickup-reminder-hours=24

# Scheduler job intervals (milliseconds)
# Auto-cancel job runs every 5 minutes
app.scheduler.auto-cancel-rate-ms=300000

# Box release job runs every 2 minutes
app.scheduler.box-release-rate-ms=120000

# Pickup reminder job runs every 1 hour
app.scheduler.reminder-rate-ms=3600000

# ===== Staff Configuration =====
# Master PIN for staff to unlock boxes
app.staff.master-pin=999999

# ===== Sample Data Configuration =====
# Enable loading sample data on startup (dev/docker profiles only)
app.data.load-sample-data=true
# Force reload data even if data already exists (WARNING: deletes existing data!)
app.data.force-reload=false

# ===== Super Admin Bootstrap =====
app.admin.bootstrap.enabled=true
app.admin.bootstrap.email=email-admin@gmail.com
app.admin.bootstrap.password=Admin@123456
app.admin.bootstrap.name=Super Admin