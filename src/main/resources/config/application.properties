#====================================================================
# Application environment settings
#====================================================================
spring.profiles.active=dev

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator

#====================================================================
# Order & Pickup Configuration
#====================================================================
# Thời gian tối đa để khách lấy đồ sau khi staff trả (giờ)
app.order.pickup-hours-limit=24

# Phí phạt trễ giờ (đồng/giờ)
app.order.pickup-overtime-fee-per-hour=500

# Phí phạt tối đa (đồng)
app.order.pickup-max-overtime-fee=50000

# Phí phạt tối đa (% của đơn hàng)
app.order.pickup-max-overtime-percent=50