#====================================================================
# Application environment settings
#====================================================================
# Profile is set via environment variable SPRING_PROFILES_ACTIVE
# Default: dev (for local development)

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator

#====================================================================
# Order & Pickup Configuration
#====================================================================
# Maximum time for customers to pick up items after staff marks the order as returned (hours)
app.order.pickup-hours-limit=24

# Overtime pickup penalty fee (VND per hour)
app.order.pickup-overtime-fee-per-hour=500

# Maximum overtime penalty fee (VND)
app.order.pickup-max-overtime-fee=50000

# Maximum overtime penalty (% of order total)
app.order.pickup-max-overtime-percent=50
