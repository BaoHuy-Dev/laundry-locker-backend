# ===========================================
# Azure + Supabase Production Configuration
# ===========================================
# Profile: azure
# Usage: -Dspring.profiles.active=azure

# Application
spring.application.name=laundry-locker-backend

# Server
server.port=8080

# ===========================================
# Supabase PostgreSQL (Connection Pooler)
# ===========================================
# IMPORTANT: Set these environment variables in Azure Container App:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://...
#   SPRING_DATASOURCE_USERNAME=postgres.xxx
#   SPRING_DATASOURCE_PASSWORD=your_password
# Spring Boot automatically binds SPRING_DATASOURCE_* to spring.datasource.*
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Pool - Optimized for Supabase Free Tier (max 60 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===========================================
# JPA/Hibernate - Production Settings
# ===========================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# IMPORTANT: Use 'update' for first deploy, then change to 'validate'
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=laundry_locker_schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===========================================
# Upstash Redis (Free Tier with TLS)
# ===========================================
# IMPORTANT: Set these environment variables in Azure Container App:
#   SPRING_DATA_REDIS_HOST=xxx.upstash.io
#   SPRING_DATA_REDIS_PORT=6379
#   SPRING_DATA_REDIS_PASSWORD=your_password
#   SPRING_DATA_REDIS_SSL_ENABLED=true
# Spring Boot automatically binds SPRING_DATA_REDIS_* to spring.data.redis.*

# ===========================================
# Security & JWT
# ===========================================
# Set APP_SECURITY_JWT_SECRET in Azure env vars
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
app.security.jwt.expiration-ms=86400000
app.security.jwt.refresh-expiration-ms=2592000000

# Rate Limiting - Enabled
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}

# CORS Configuration (Azure)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.security.cors.max-age=3600

# ===========================================
# Application URLs
# ===========================================
app.name=${APP_NAME:Laundry Locker}
app.frontend.url=${FRONTEND_URL}
app.backend.url=${BACKEND_URL}

# ===========================================
# Email Configuration (SMTP)
# ===========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Expiration Settings
app.email.verification-expiration-ms=86400000
app.email.reset-password-expiration-ms=3600000

# ===========================================
# OAuth2 - Google
# ===========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===========================================
# OAuth2 - GitHub
# ===========================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===========================================
# OAuth2 - Facebook
# ===========================================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ===========================================
# OAuth2 - Zalo
# ===========================================
spring.security.oauth2.client.registration.zalo.client-id=${ZALO_CLIENT_ID}
spring.security.oauth2.client.registration.zalo.client-secret=${ZALO_CLIENT_SECRET}
spring.security.oauth2.client.registration.zalo.scope=profile
spring.security.oauth2.client.registration.zalo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.zalo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zalo.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.zalo.authorization-uri=https://oauth.zaloapp.com/v4/authorize
spring.security.oauth2.client.provider.zalo.token-uri=https://oauth.zaloapp.com/v4/access_token
spring.security.oauth2.client.provider.zalo.user-info-uri=https://graph.zalo.me/v2.0/me?fields=id,name,picture
spring.security.oauth2.client.provider.zalo.user-name-attribute=id

# ===========================================
# Swagger - Disabled by default in production
# ===========================================
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ===========================================
# Logging - Production (minimal)
# ===========================================
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.huynqb.laundrylockerbackend=INFO

# Error Response - Don't leak sensitive info
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never

spring.output.ansi.enabled=DETECT

# ===========================================
# Firebase Configuration
# ===========================================
# In production, use environment variable for JSON content
# Option 1: File path (if you upload the file to Azure)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account.json}

# ===========================================
# VNPay Configuration (Production)
# ===========================================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
# Production URL (change from sandbox when ready)
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${app.backend.url}/api/payments/vnpay/return
vnpay.ipn-url=${app.backend.url}/api/payments/vnpay/ipn
vnpay.version=2.1.0
vnpay.expire-minutes=15

# ===========================================
# MoMo Configuration (Production)
# ===========================================
momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
# Production URL (change from test-payment when ready)
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${app.backend.url}/api/payments/momo/return
momo.ipn-url=${app.backend.url}/api/payments/momo/callback
momo.expire-minutes=15

# ===========================================
# Scheduler Configuration
# ===========================================
# Auto-cancel orders not confirmed within this time (minutes)
app.scheduler.order-confirm-timeout-minutes=${SCHEDULER_ORDER_TIMEOUT:30}

# Delay before releasing boxes after order completion (minutes)
app.scheduler.box-release-delay-minutes=${SCHEDULER_BOX_RELEASE_DELAY:5}

# Send pickup reminders after this time waiting (hours)
app.scheduler.pickup-reminder-hours=${SCHEDULER_PICKUP_REMINDER:24}

# Scheduler job intervals (milliseconds)
# Auto-cancel job runs every 5 minutes
app.scheduler.auto-cancel-rate-ms=300000

# Box release job runs every 2 minutes
app.scheduler.box-release-rate-ms=120000

# Pickup reminder job runs every 1 hour
app.scheduler.reminder-rate-ms=3600000

# ===========================================
# Staff Configuration
# ===========================================
# Master PIN for staff to unlock boxes (CHANGE IN PRODUCTION!)
app.staff.master-pin=${STAFF_MASTER_PIN:999999}

# ===========================================
# Sample Data Configuration (DISABLED in Production)
# ===========================================
app.data.load-sample-data=false
app.data.force-reload=false

# ===========================================
# Super Admin Bootstrap
# ===========================================
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Super Admin}

# ===========================================
# Order & Pickup Configuration
# ===========================================
# Maximum time for customer to pick up after staff returns (hours)
app.order.pickup-hours-limit=${ORDER_PICKUP_HOURS_LIMIT:24}

# Late fee per hour (VND)
app.order.pickup-overtime-fee-per-hour=${ORDER_OVERTIME_FEE:500}

# Maximum late fee (VND)
app.order.pickup-max-overtime-fee=${ORDER_MAX_OVERTIME_FEE:50000}

# Maximum late fee (% of order)
app.order.pickup-max-overtime-percent=${ORDER_MAX_OVERTIME_PERCENT:50}
