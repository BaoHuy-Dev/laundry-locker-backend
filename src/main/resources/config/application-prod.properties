# Application
spring.application.name=laundry-locker-backend

# Server
server.port=8080

# DataSource - PostgreSQL (use env vars in production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/laundry_locker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - PRODUCTION SETTINGS
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=laundry_locker_schema
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JWT
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=86400000
app.security.jwt.refresh-expiration-ms=2592000000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Rate Limiting - ENABLED IN PRODUCTION
app.security.rate-limit.enabled=true
app.security.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:60}

# CORS Configuration (PRODUCTION - use env vars)
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-domain.com}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.security.cors.max-age=3600


# Application Settings
app.name=${APP_NAME:Laundry Locker}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Expiration Settings
app.email.verification-expiration-ms=86400000
app.email.reset-password-expiration-ms=3600000

# Swagger - DISABLE IN PRODUCTION or protect with auth
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# SQL + bind param - DISABLED IN PRODUCTION
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Spring Security - REDUCED LOGGING
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.filter=WARN
logging.level.com.huynqb.laundrylockerbackend=INFO

# Exception handling
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN

# Error Response - PRODUCTION (don't leak sensitive info)
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false
spring.web.error.include-stacktrace=never

# Logging settings - PRODUCTION
spring.output.ansi.enabled=DETECT
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.java.sql=WARN
logging.level.java.sql.Statement=WARN
logging.level.java.sql.PreparedStatement=WARN
logging.level.java.sql.ResultSet=WARN
logging.level.com.zaxxer.hikari=WARN

# OAuth2 Client - Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAUTH2 CLIENT - GITHUB
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OAuth2 Client - Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.facebook.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.facebook.client-authentication-method=client_secret_post

# OAuth2 Provider - Facebook
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# OAuth2 Client - Zalo
spring.security.oauth2.client.registration.zalo.client-id=${ZALO_CLIENT_ID}
spring.security.oauth2.client.registration.zalo.client-secret=${ZALO_CLIENT_SECRET}
spring.security.oauth2.client.registration.zalo.scope=profile
spring.security.oauth2.client.registration.zalo.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.zalo.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.zalo.client-authentication-method=client_secret_post

# OAuth2 Provider - Zalo
spring.security.oauth2.client.provider.zalo.authorization-uri=https://oauth.zaloapp.com/v4/authorize
spring.security.oauth2.client.provider.zalo.token-uri=https://oauth.zaloapp.com/v4/access_token
spring.security.oauth2.client.provider.zalo.user-info-uri=https://graph.zalo.me/v2.0/me?fields=id,name,picture
spring.security.oauth2.client.provider.zalo.user-name-attribute=id

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ===== Firebase Configuration =====
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase/firebase-service-account.json}

# ===== VNPay Configuration =====
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.pay-url=${VNPAY_PAY_URL:https://pay.vnpay.vn/vpcpay.html}
vnpay.return-url=${BACKEND_URL:http://localhost:8080}/api/payments/vnpay/return
vnpay.ipn-url=${BACKEND_URL:http://localhost:8080}/api/payments/vnpay/ipn
vnpay.version=2.1.0
vnpay.expire-minutes=15

# ===== MoMo Configuration =====
momo.partner-code=${MOMO_PARTNER_CODE}
momo.access-key=${MOMO_ACCESS_KEY}
momo.secret-key=${MOMO_SECRET_KEY}
momo.endpoint=${MOMO_ENDPOINT:https://payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${BACKEND_URL:http://localhost:8080}/api/payments/momo/return
momo.ipn-url=${BACKEND_URL:http://localhost:8080}/api/payments/momo/callback
momo.expire-minutes=15

# ===== Sample Data - DISABLED IN PRODUCTION =====
app.data.load-sample-data=false
app.data.force-reload=false

# ===== MQTT Configuration (IoT Locker Control) =====
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=laundry-backend-prod-${random.uuid}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic-prefix=locker

# ===== Super Admin Bootstrap =====
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Super Admin}

# ===== Scheduler Configuration =====
app.scheduler.order-confirm-timeout-minutes=${SCHEDULER_ORDER_TIMEOUT:30}
app.scheduler.box-release-delay-minutes=${SCHEDULER_BOX_RELEASE_DELAY:5}
app.scheduler.pickup-reminder-hours=${SCHEDULER_PICKUP_REMINDER:24}
app.scheduler.auto-cancel-rate-ms=300000
app.scheduler.box-release-rate-ms=120000
app.scheduler.reminder-rate-ms=3600000

# ===== Staff Configuration =====
app.staff.master-pin=${STAFF_MASTER_PIN:999999}

# ===== Order & Pickup Configuration =====
app.order.pickup-hours-limit=${ORDER_PICKUP_HOURS_LIMIT:24}
app.order.pickup-overtime-fee-per-hour=${ORDER_OVERTIME_FEE:500}
app.order.pickup-max-overtime-fee=${ORDER_MAX_OVERTIME_FEE:50000}
app.order.pickup-max-overtime-percent=${ORDER_MAX_OVERTIME_PERCENT:50}

