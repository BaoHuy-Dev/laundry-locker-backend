# ===========================================
# GitHub Actions: Build and Deploy to Azure Container Apps
# ===========================================
# Trigger: Push to main/develop or manual dispatch
# 
# Required Secrets (Add in GitHub Repository Settings):
#   - ACR_USERNAME: Azure Container Registry username
#   - ACR_PASSWORD: Azure Container Registry password  
#   - AZURE_CREDENTIALS: Azure Service Principal JSON
# ===========================================

name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: laundrylockeracr.azurecr.io
  IMAGE_NAME: laundry-locker
  CONTAINER_APP_NAME: laundry-locker-api
  RESOURCE_GROUP: laundry-locker-rg

jobs:
  # ==================== BUILD ====================
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests -B
      
      - name: Run tests
        run: ./mvnw test -B
        continue-on-error: true
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # ==================== DOCKER BUILD & PUSH ====================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== DEPLOY ====================
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: https://laundry-locker-api.mangotree-f5c365fa.eastasia.azurecontainerapps.io
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      
      - name: Health Check
        run: |
          echo "⏳ Waiting for deployment to stabilize..."
          sleep 90
          
          # Health check with retries
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              https://laundry-locker-api.mangotree-f5c365fa.eastasia.azurecontainerapps.io/actuator/health \
              --max-time 30)
            
            if [ "$response" == "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            else
              echo "⏳ Attempt $i: Health check returned $response, retrying in 30s..."
              sleep 30
            fi
          done
          
          echo "⚠️ Health check did not pass after 5 attempts (may still be starting)"
      
      - name: Azure logout
        run: az logout
        if: always()

  # ==================== NOTIFY ====================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [build, docker, deploy]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 Deployment successful!"
            echo "📍 URL: https://laundry-locker-api.mangotree-f5c365fa.eastasia.azurecontainerapps.io"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Build failed!"
          elif [ "${{ needs.docker.result }}" == "failure" ]; then
            echo "❌ Docker build/push failed!"
          else
            echo "⚠️ Deployment may have issues"
          fi
