# Mosquitto Configuration for Production
# ================================================
# Usage: mount this file instead of mosquitto.conf in docker-compose.prod.yml
#   volumes:
#     - ./docker/mosquitto/mosquitto-prod.conf:/mosquitto/config/mosquitto.conf:ro

# Default listener (MQTT protocol)
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT clients)
listener 9001
protocol websockets

# DISABLE anonymous connections in production
allow_anonymous false

# Password file for authentication
# Generate: mosquitto_passwd -c /mosquitto/config/passwd mqtt_user
password_file /mosquitto/config/passwd

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging - production (less verbose)
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# Connection limits
max_connections 100

